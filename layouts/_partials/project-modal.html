<div class="portfolio-modal modal fade" id="project-{{ .File.ContentBaseName }}" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-content">
        <div class="close-modal" data-dismiss="modal">
            <div class="lr">
                <div class="rl"></div>
            </div>
        </div>
        <div class="container">
            <div class="row">
                <div class="col-lg-8 col-lg-offset-2">
                    <div class="modal-body">
                        <h2>{{ .Title }}</h2>
                        {{ with .Params.subtitle }}<h4>{{ . }}</h4>{{ end }}
                        <p class="item-intro text-muted">{{ .Params.intro }}</p>
                        {{ .Content }}
                        <button type="button" class="btn btn-primary" data-dismiss="modal"><i class="fa fa-times"></i> Close Project</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
