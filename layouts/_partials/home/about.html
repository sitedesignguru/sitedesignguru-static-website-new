{{- $p := .page.Params -}}
    <section id="about" class="halo halo-founder">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2>{{ .page.Title }}</h2>
                </div>
            </div>
            <div class="founder">
                <figure class="founder-photo">
                    <img src="{{ partial "asset.html" $p.photo }}" width="300" height="300" alt="{{ $p.photo_alt }}"/>
                    <figcaption>{{ $p.photo_caption }}</figcaption>
                </figure>
                <div class="founder-copy">
                    <p class="chapter-tag">{{ $p.role }}</p>
                    <h3 class="founder-name">{{ $p.name }}</h3>
                    <p class="founder-lede">{{ $p.lede }}</p>
                    {{ .page.Content }}
                    <a class="founder-link" href="{{ $p.link.url }}"><i class="fa fa-linkedin-square"></i> {{ $p.link.text }}</a>
                </div>
            </div>
            {{ partial "testimonial.html" (dict "testimonial" $p.testimonial "class" "about-testimonial") }}
        </div>
    </section>
