{{- $s := site.GetPage "/settings" -}}
{{- $page := . -}}
    <nav class="navbar navbar-default navbar-fixed-top">
        <div class="container">
            <div class="navbar-header{{ if .IsHome }} page-scroll{{ end }}">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#bs-example-navbar-collapse-1">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand{{ if .IsHome }} page-scroll{{ end }}" href="{{ site.Home.RelPermalink }}{{ if .IsHome }}#page-top{{ end }}"><img src="{{ partial "asset.html" $s.Params.logo }}" width="293" height="60" alt="{{ $s.Params.logo_alt }}"/></a>
            </div>
            <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
                <ul class="nav navbar-nav navbar-right">
{{- if .IsHome }}
                    <li class="hidden active"><a href="{{ site.Home.RelPermalink }}#page-top"></a></li>
{{- end }}
{{- range $s.Params.nav }}
{{- if or $page.IsHome (not .home_only) }}
{{- $href := partial "href.html" .link }}
                    <li{{ if eq $href $page.RelPermalink }} class="active"{{ end }}><a{{ if and $page.IsHome (hasPrefix .link "#") }} class="page-scroll"{{ end }} href="{{ $href }}">{{ .label }}</a></li>
{{- end }}
{{- end }}
                </ul>
            </div>
        </div>
    </nav>
