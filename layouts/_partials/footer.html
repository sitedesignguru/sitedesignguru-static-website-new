{{- $s := site.GetPage "/settings" -}}
    <footer>
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <span class="copyright"> &copy; <script>document.write(new Date().getFullYear())</script> <span itemprop="name">{{ $s.Params.site_name }}</span> </span>
                </div>
                <div class="col-md-4">
                    <ul class="list-inline social-buttons">
{{- range $s.Params.social }}
                        <li><a href="{{ .url }}" aria-label="{{ .label }}">
{{- if eq .icon "x" -}}
<svg class="icon-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>
{{- else -}}
<i class="fa fa-{{ .icon }}"></i>
{{- end -}}
</a></li>
{{- end }}
                    </ul>
                </div>
                <div class="col-md-4">
                    <ul class="list-inline quicklinks">
{{- range $s.Params.footer_links }}
                        <li><a href="{{ partial "href.html" .link }}">{{ .label }}</a></li>
{{- end }}
                    </ul>
                </div>
            </div>
        </div>
    </footer>
